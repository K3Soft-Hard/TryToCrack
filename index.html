<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Advanced HID Security Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        body {
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.05), transparent 25%);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fluid Glass Panels */
        .glass-panel {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        /* Device Frame sizing */
        .device-base {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            background: #000;
            overflow: hidden;
            box-shadow: 0 40px 80px -10px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
            cursor: text; /* Indicates readiness for keyboard */
        }

        .device-base::after {
            content: 'KEYBOARD ACTIVE';
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            letter-spacing: 2px;
            color: rgba(59, 130, 246, 0.5);
            font-weight: 800;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }
        
        .device-base:hover::after, .device-base:focus-within::after {
            opacity: 1;
        }

        /* Mobile Phone Aspect Ratio */
        .mode-phone {
            width: 100%;
            max-width: 360px;
            aspect-ratio: 9 / 19.5;
            border-radius: 44px;
            border: 10px solid #1a1a1a;
        }

        /* PC Aspect Ratio */
        .mode-pc {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 10;
            border-radius: 24px;
            border: 12px solid #1a1a1a;
        }

        /* Fullscreen Override */
        .device-base.fs-active {
            max-width: none !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0 !important;
            border: none !important;
            aspect-ratio: auto !important;
        }

        .screen-content {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            background-size: cover;
            background-position: center;
        }

        /* Themes */
        .bg-ios { background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop'); }
        .bg-android { background-image: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=1000&auto=format&fit=crop'); }
        .bg-windows { background-image: url('https://images.unsplash.com/photo-1633412802994-5c058f151b66?q=80&w=1000&auto=format&fit=crop'); }

        .os-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 100%);
            display: flex; flex-direction: column;
            z-index: 10;
        }

        /* Typography */
        .font-mono-safe { font-family: 'JetBrains Mono', monospace; }
        .clock-ios { font-size: clamp(4rem, 15vw, 6rem); font-weight: 200; letter-spacing: -2px; line-height: 1; }
        .clock-win { font-size: clamp(3rem, 10vw, 5rem); font-weight: 600; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }

        /* Keypad */
        .key {
            aspect-ratio: 1;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            cursor: pointer;
            transition: 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
        }
        .key:active { background: rgba(255,255,255,0.25); transform: scale(0.9); }

        /* PIN Dots */
        .dot {
            width: clamp(10px, 3vw, 14px);
            height: clamp(10px, 3vw, 14px);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            transition: 0.2s ease;
        }
        .dot.active { background: #fff; border-color: #fff; transform: scale(1.1); box-shadow: 0 0 10px #fff; }

        /* Cursor Animation for active input */
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor-blink::after {
            content: '|';
            animation: blink 1s step-end infinite;
            margin-left: 2px;
            opacity: 0.5;
        }
        .pass-container.focused { border-color: #3b82f6 !important; background: rgba(255,255,255,0.15) !important; }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        select, input[type="password"], input[type="text"] {
            background: transparent; color: white; outline: none;
        }
        option { background: #1a1a1a; color: white; }
    </style>
</head>
<body class="antialiased">

    <!-- HID Catcher for robust keyboard capture without disturbing visual UI -->
    <input type="text" id="hidCatcher" class="absolute opacity-0 pointer-events-none" style="top:-9999px;" autocomplete="off">

    <!-- MAIN LAYOUT WRAPPER -->
    <div id="mainUI" class="flex flex-col lg:flex-row gap-6 p-4 lg:p-8 w-full max-w-[1600px] mx-auto min-h-screen items-center justify-center transition-opacity duration-300">
        
        <!-- LEFT PANEL: CONFIGURATION -->
        <div class="side-panel w-full lg:w-[340px] flex-shrink-0 flex flex-col gap-6 order-2 lg:order-1">
            <div class="glass-panel p-6">
                <h2 class="text-[10px] font-black tracking-widest uppercase text-blue-500 mb-6 flex items-center gap-2">
                    <i class="fas fa-sliders-h"></i> Simulation Engine
                </h2>
                
                <div class="space-y-3 mb-8">
                    <button onclick="setTheme('ios')" id="btn-ios" class="w-full py-3 px-4 rounded-xl border border-white/10 flex justify-between items-center bg-blue-600 transition">
                        <span class="text-xs font-bold">Apple iOS</span> <i class="fab fa-apple text-lg"></i>
                    </button>
                    <button onclick="setTheme('android')" id="btn-android" class="w-full py-3 px-4 rounded-xl border border-white/10 flex justify-between items-center bg-white/5 hover:bg-white/10 transition">
                        <span class="text-xs font-bold opacity-70">Android</span> <i class="fab fa-android text-lg opacity-50"></i>
                    </button>
                    <button onclick="setTheme('windows')" id="btn-windows" class="w-full py-3 px-4 rounded-xl border border-white/10 flex justify-between items-center bg-white/5 hover:bg-white/10 transition">
                        <span class="text-xs font-bold opacity-70">Windows PC</span> <i class="fab fa-windows text-lg opacity-50"></i>
                    </button>
                </div>

                <div class="space-y-6">
                    <div>
                        <label class="text-[9px] uppercase font-bold opacity-40 mb-2 block tracking-widest">Authentication</label>
                        <div class="flex p-1 bg-black/40 rounded-lg">
                            <button onclick="setMode('pin')" id="mode-pin" class="flex-1 py-2 rounded-md bg-white/20 text-[10px] font-bold">PIN</button>
                            <button onclick="setMode('pass')" id="mode-pass" class="flex-1 py-2 rounded-md text-[10px] font-bold opacity-50">Password</button>
                        </div>
                    </div>

                    <div id="pinControl">
                        <label class="text-[9px] uppercase font-bold opacity-40 mb-2 block tracking-widest">Complexity</label>
                        <div class="flex gap-2">
                            <button onclick="setPinLen(4)" id="len-4" class="flex-1 py-2 bg-blue-500/20 border border-blue-500/50 rounded-lg text-[10px] font-bold">4-Digit</button>
                            <button onclick="setPinLen(6)" id="len-6" class="flex-1 py-2 bg-white/5 rounded-lg text-[10px] font-bold opacity-50">6-Digit</button>
                        </div>
                    </div>

                    <div class="p-3 bg-black/40 rounded-xl border border-white/5">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[9px] font-bold opacity-40 uppercase tracking-widest">Target Secret</span>
                            <button onclick="toggleVisibility()" class="opacity-40 hover:opacity-100 p-1"><i class="fas fa-eye text-xs"></i></button>
                        </div>
                        <!-- config-input class ensures our global listener ignores keystrokes here -->
                        <input type="password" id="secret" value="1234" oninput="calcEstimation()" class="config-input w-full font-mono-safe text-lg text-blue-400 tracking-widest mt-1">
                    </div>
                </div>
            </div>

            <!-- Lockout Rules -->
            <div class="glass-panel p-6 border-t-2 border-t-red-500/50">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-[10px] font-black uppercase tracking-widest text-red-400">Lockout Policy</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="noLock" class="sr-only peer config-input">
                        <div class="w-8 h-4 bg-white/10 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-red-500"></div>
                    </label>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-black/30 p-2 rounded-lg">
                        <div class="text-[8px] opacity-40 uppercase font-bold mb-1">Tier 1 (3x)</div>
                        <select id="lock1" class="config-input text-[10px] w-full font-bold"><option value="30">30 Sec</option><option value="60">1 Min</option></select>
                    </div>
                    <div class="bg-black/30 p-2 rounded-lg">
                        <div class="text-[8px] opacity-40 uppercase font-bold mb-1">Tier 2 (6x)</div>
                        <select id="lock2" class="config-input text-[10px] w-full font-bold"><option value="300">5 Min</option><option value="600">10 Min</option></select>
                    </div>
                </div>
            </div>
        </div>

        <!-- CENTER: DEVICE ANCHOR -->
        <div id="deviceWrapper" class="w-full flex-1 flex justify-center items-center order-1 lg:order-2 z-40 transition-all duration-300">
            <!-- The actual device -->
            <div id="deviceBody" class="device-base mode-phone" onclick="focusDevice()">
                <div id="screen" class="screen-content bg-ios">
                    
                    <!-- Lockout Overlay -->
                    <div id="lockoutUI" class="absolute inset-0 bg-black/90 backdrop-blur-md z-50 flex-col items-center justify-center text-center hidden">
                        <div class="w-16 h-16 rounded-full border-2 border-red-500 flex items-center justify-center mb-6 animate-pulse">
                            <i class="fas fa-shield-alt text-2xl text-red-500"></i>
                        </div>
                        <h2 class="text-lg font-black uppercase tracking-widest">Locked Out</h2>
                        <p class="text-[10px] opacity-50 mt-2">Too many attempts.</p>
                        <div id="timerDisplay" class="font-mono-safe text-5xl mt-6 text-white">00:00</div>
                    </div>

                    <!-- OS Overlay -->
                    <div class="os-overlay p-4 md:p-6 lg:p-8 pointer-events-none">
                        
                        <!-- Top Bar (Mobile) -->
                        <div id="mobileStatusBar" class="flex justify-between items-center text-[10px] md:text-xs font-bold pt-1">
                            <span class="clock-display">12:00</span>
                            <div class="flex gap-2">
                                <i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i>
                            </div>
                        </div>

                        <!-- Clocks -->
                        <div id="clockContainer" class="flex-1 flex flex-col items-center justify-start mt-8 md:mt-12 transition-all">
                            <div class="clock-display clock-ios" id="mainClock">12:00</div>
                            <div class="text-sm md:text-base opacity-80 mt-2" id="dateDisplay">Monday, Jan 1</div>
                        </div>

                        <!-- Authentication Area -->
                        <div id="authContainer" class="w-full flex flex-col items-center mb-4 md:mb-8 pointer-events-auto">
                            
                            <!-- Windows User Card -->
                            <div id="winUserCard" class="hidden flex-col items-center mb-6">
                                <div class="w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center mb-4 shadow-lg">
                                    <i class="fas fa-user text-3xl"></i>
                                </div>
                                <div class="text-2xl font-light tracking-tight mb-2">Administrator</div>
                            </div>

                            <p id="authPrompt" class="text-[10px] md:text-xs font-bold uppercase tracking-[0.2em] opacity-60 mb-6 transition-colors duration-300">Enter Passcode</p>
                            
                            <!-- Inputs -->
                            <div id="pinDots" class="flex justify-center gap-4 h-6 mb-8 w-full cursor-pointer" onclick="focusDevice()"></div>
                            
                            <div id="passInputArea" class="hidden w-full max-w-[280px] mb-8 cursor-pointer" onclick="focusDevice()">
                                <!-- Fake input display for styling, controlled via keyboard events -->
                                <div id="passInputFake" class="pass-container w-full bg-white/10 border border-white/20 p-3 rounded-xl text-center font-mono-safe text-xl tracking-widest transition-colors cursor-blink min-h-[50px] flex items-center justify-center"></div>
                            </div>

                            <!-- Keypad -->
                            <div id="numpad" class="grid grid-cols-3 gap-4 md:gap-6 w-full max-w-[260px] mx-auto">
                                <div class="key" onclick="press('1')">1</div><div class="key" onclick="press('2')">2</div><div class="key" onclick="press('3')">3</div>
                                <div class="key" onclick="press('4')">4</div><div class="key" onclick="press('5')">5</div><div class="key" onclick="press('6')">6</div>
                                <div class="key" onclick="press('7')">7</div><div class="key" onclick="press('8')">8</div><div class="key" onclick="press('9')">9</div>
                                <div></div><div class="key" onclick="press('0')">0</div>
                                <div class="flex items-center justify-center opacity-40 hover:opacity-100 active:scale-90 transition cursor-pointer" onclick="back()">
                                    <i class="fas fa-backspace text-xl"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: ANALYTICS -->
        <div class="side-panel w-full lg:w-[340px] flex-shrink-0 flex flex-col gap-6 order-3 transition-opacity">
            <div class="glass-panel p-6 flex flex-col h-[300px] lg:h-full max-h-[500px]">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-[10px] font-black tracking-widest uppercase opacity-40">Payload Stream</h3>
                    <div class="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-1 rounded text-[9px] font-bold" id="payloadCount">0 EXEC</div>
                </div>
                
                <div id="logStream" class="flex-1 overflow-y-auto custom-scroll font-mono-safe text-[10px] space-y-2 pr-2">
                    <div class="opacity-30 italic">>> System awaiting HID inputs...</div>
                </div>
                
                <button onclick="clearLogs()" class="mt-4 pt-4 border-t border-white/10 text-[9px] font-bold uppercase tracking-widest opacity-40 hover:opacity-100 transition w-full text-left flex justify-between">
                    <span>Clear Stream</span> <i class="fas fa-trash"></i>
                </button>
            </div>

            <div class="glass-panel p-6">
                <h3 class="text-[10px] font-black tracking-widest uppercase opacity-40 mb-4">Crack Estimator</h3>
                <div class="flex justify-between items-end mb-2">
                    <span class="text-[10px] opacity-60">Est. Time</span>
                    <span id="estTimeTxt" class="text-lg font-black text-blue-400">0.0s</span>
                </div>
                <div class="h-1.5 bg-black/40 rounded-full overflow-hidden mb-4">
                    <div id="estBar" class="h-full bg-blue-500 w-0 transition-all duration-500"></div>
                </div>
                <button onclick="toggleFS()" class="w-full py-3 bg-white/5 border border-white/10 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:bg-white/10 transition mt-2">
                    <i class="fas fa-expand mr-2"></i> Fullscreen Mode
                </button>
            </div>
        </div>
    </div>

    <!-- FULLSCREEN HUD -->
    <div id="fsHUD" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-black/80 backdrop-blur-xl border border-white/10 px-4 py-3 rounded-full flex gap-4 items-center z-[200] hidden shadow-2xl">
        <button onclick="toggleHUD()" class="w-8 h-8 rounded-full bg-white/5 hover:bg-yellow-500/20 hover:text-yellow-500 flex items-center justify-center transition" title="Hide UI">
            <i class="fas fa-eye-slash text-xs"></i>
        </button>
        <div class="w-[1px] h-6 bg-white/10"></div>
        <div id="fsPayloadCount" class="font-mono-safe text-[10px] text-blue-400 font-bold px-2">0 EXEC</div>
        <div class="w-[1px] h-6 bg-white/10"></div>
        <button onclick="toggleFS()" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-full text-[9px] font-black uppercase tracking-widest transition">
            Exit
        </button>
    </div>

    <button id="revealHUD" onclick="toggleHUD()" class="fixed bottom-4 right-4 w-10 h-10 bg-black/50 backdrop-blur-md rounded-full border border-white/20 text-white/50 hover:text-white z-[200] hidden flex items-center justify-center transition">
        <i class="fas fa-eye"></i>
    </button>

    <script>
        const state = {
            theme: 'ios',
            mode: 'pin',
            pinLen: 4,
            buffer: '',
            streak: 0,
            total: 0,
            locked: false,
            isFullscreen: false,
            hudHidden: false,
            autoSubmitTimer: null
        };

        const UI = {
            deviceWrapper: document.getElementById('deviceWrapper'),
            deviceBody: document.getElementById('deviceBody'),
            screen: document.getElementById('screen'),
            panels: document.querySelectorAll('.side-panel'),
            hidCatcher: document.getElementById('hidCatcher'),
            passFake: document.getElementById('passInputFake')
        };

        function init() {
            setTheme('ios');
            setMode('pin');
            updateTime();
            calcEstimation();
            setInterval(updateTime, 1000);

            // GLOBAL Keyboard Listener - ensures Rubber Ducky works perfectly
            document.addEventListener('keydown', handlePhysicalKeyboard);
            
            // Keep device ready for typing when clicked
            focusDevice();
        }

        // --- Keyboard / HID Engine ---
        
        function focusDevice() {
            UI.hidCatcher.focus();
            UI.passFake.classList.add('focused', 'cursor-blink');
        }

        // Handle clicking away from the device
        document.addEventListener('click', (e) => {
            if (!UI.deviceBody.contains(e.target) && !e.target.closest('.key')) {
                UI.passFake.classList.remove('focused', 'cursor-blink');
            }
        });

        function handlePhysicalKeyboard(e) {
            // Ignore keystrokes if typing inside the configuration fields!
            if (e.target.classList.contains('config-input') || e.target.tagName === 'SELECT') {
                return;
            }

            if(state.locked) return;
            
            // Hotkeys
            if(e.key.toLowerCase() === 'f' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); toggleFS(); return; }
            if(e.key.toLowerCase() === 'h' && state.isFullscreen) { e.preventDefault(); toggleHUD(); return; }

            // Route keys based on mode
            if(state.mode === 'pin') {
                // Pin mode only accepts 0-9
                if(/^[0-9]$/.test(e.key)) {
                    e.preventDefault();
                    press(e.key);
                }
            } else {
                // Password mode accepts any single visible character
                if(e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    press(e.key);
                }
            }

            if(e.key === 'Enter') { e.preventDefault(); submit(); }
            if(e.key === 'Backspace') { e.preventDefault(); back(); }
        }

        function press(c) {
            if(state.locked) return;
            if(state.mode === 'pin' && state.buffer.length >= state.pinLen) return;
            
            state.buffer += c;
            renderInputs();
            focusDevice();
            
            // Auto submit for PIN (debounce added to prevent double-submit with Rubber Ducky 'ENTER')
            if(state.mode === 'pin' && state.buffer.length === state.pinLen) {
                if(state.autoSubmitTimer) clearTimeout(state.autoSubmitTimer);
                state.autoSubmitTimer = setTimeout(submit, 150); 
            }
        }

        function back() {
            state.buffer = state.buffer.slice(0, -1);
            renderInputs();
            focusDevice();
        }

        function submit() {
            if(!state.buffer || state.locked) return;
            
            // Clear auto-submit timer so pressing ENTER via Ducky doesn't trigger twice
            if(state.autoSubmitTimer) {
                clearTimeout(state.autoSubmitTimer);
                state.autoSubmitTimer = null;
            }

            const target = document.getElementById('secret').value;
            const payload = state.buffer;
            state.total++;
            
            if(payload === target) {
                logMsg(`ACCESS GRANTED: [${payload}]`, 'text-green-400 bg-green-500/10 px-2 rounded');
                state.streak = 0;
                
                const prompt = document.getElementById('authPrompt');
                prompt.innerText = "UNLOCKED";
                prompt.classList.replace('opacity-60', 'text-green-500');
                
                setTimeout(() => {
                    prompt.innerText = state.theme === 'windows' ? (state.mode === 'pin' ? 'Sign in with PIN' : 'Sign in with Password') : (state.theme === 'android' ? 'Enter PIN' : 'Enter Passcode');
                    prompt.classList.replace('text-green-500', 'opacity-60');
                }, 2000);

            } else {
                logMsg(`DENIED: [${payload}]`, 'text-red-400 opacity-80');
                state.streak++;
                triggerShake();
                
                if(!document.getElementById('noLock').checked) {
                    checkLockout();
                }
            }
            
            document.getElementById('payloadCount').innerText = `${state.total} EXEC`;
            document.getElementById('fsPayloadCount').innerText = `${state.total} EXEC`;
            state.buffer = '';
            renderInputs();
        }

        // --- Render UI ---

        function renderInputs() {
            if(state.mode === 'pin') {
                const container = document.getElementById('pinDots');
                container.innerHTML = '';
                for(let i=0; i<state.pinLen; i++) {
                    const d = document.createElement('div');
                    d.className = i < state.buffer.length ? 'dot active' : 'dot';
                    container.appendChild(d);
                }
            } else {
                UI.passFake.innerText = '•'.repeat(state.buffer.length);
            }
        }

        function setTheme(t) {
            state.theme = t;
            state.buffer = '';
            
            ['ios', 'android', 'windows'].forEach(os => {
                const btn = document.getElementById(`btn-${os}`);
                if(btn) {
                    if(t === os) {
                        btn.classList.replace('bg-white/5', 'bg-blue-600');
                        btn.querySelector('span').classList.remove('opacity-70');
                        btn.querySelector('i').classList.remove('opacity-50');
                    } else {
                        btn.classList.replace('bg-blue-600', 'bg-white/5');
                        btn.querySelector('span').classList.add('opacity-70');
                        btn.querySelector('i').classList.add('opacity-50');
                    }
                }
            });

            UI.deviceBody.className = `device-base ${t === 'windows' ? 'mode-pc' : 'mode-phone'} ${state.isFullscreen ? 'fs-active' : ''}`;
            UI.screen.className = `screen-content bg-${t}`;

            document.getElementById('mobileStatusBar').classList.toggle('hidden', t === 'windows');
            document.getElementById('winUserCard').classList.toggle('hidden', t !== 'windows');
            
            const clock = document.getElementById('mainClock');
            if(t === 'windows') {
                clock.className = 'clock-display clock-win';
                document.getElementById('clockContainer').classList.replace('justify-start', 'justify-center');
                document.getElementById('authPrompt').innerText = state.mode === 'pin' ? 'Sign in with PIN' : 'Sign in with Password';
            } else {
                clock.className = 'clock-display clock-ios';
                document.getElementById('clockContainer').classList.replace('justify-center', 'justify-start');
                document.getElementById('authPrompt').innerText = t === 'android' ? 'Enter PIN' : 'Enter Passcode';
            }

            renderInputs();
            focusDevice();
            logMsg(`System architecture shifted to ${t.toUpperCase()}`, 'text-blue-400');
        }

        function setMode(m) {
            state.mode = m;
            state.buffer = '';
            
            document.getElementById('mode-pin').className = m === 'pin' ? 'flex-1 py-2 rounded-md bg-white/20 text-[10px] font-bold' : 'flex-1 py-2 rounded-md text-[10px] font-bold opacity-50';
            document.getElementById('mode-pass').className = m === 'pass' ? 'flex-1 py-2 rounded-md bg-white/20 text-[10px] font-bold' : 'flex-1 py-2 rounded-md text-[10px] font-bold opacity-50';
            
            document.getElementById('pinControl').classList.toggle('hidden', m !== 'pin');
            document.getElementById('pinDots').classList.toggle('hidden', m !== 'pin');
            document.getElementById('numpad').classList.toggle('hidden', m !== 'pin');
            document.getElementById('passInputArea').classList.toggle('hidden', m !== 'pass');
            
            if(state.theme === 'windows') {
                document.getElementById('authPrompt').innerText = m === 'pin' ? 'Sign in with PIN' : 'Sign in with Password';
            }

            renderInputs();
            calcEstimation();
            focusDevice();
        }

        function setPinLen(l) {
            state.pinLen = l;
            state.buffer = '';
            document.getElementById('len-4').className = l === 4 ? 'flex-1 py-2 bg-blue-500/20 border border-blue-500/50 rounded-lg text-[10px] font-bold' : 'flex-1 py-2 bg-white/5 rounded-lg text-[10px] font-bold opacity-50';
            document.getElementById('len-6').className = l === 6 ? 'flex-1 py-2 bg-blue-500/20 border border-blue-500/50 rounded-lg text-[10px] font-bold' : 'flex-1 py-2 bg-white/5 rounded-lg text-[10px] font-bold opacity-50';
            renderInputs();
            calcEstimation();
            focusDevice();
        }

        // --- Layout Control ---
        
        function toggleFS() {
            state.isFullscreen = !state.isFullscreen;
            
            if (state.isFullscreen) {
                UI.deviceWrapper.classList.add('fixed', 'inset-0', 'bg-black', 'p-0', 'm-0');
                UI.deviceWrapper.classList.remove('relative', 'flex-1');
                UI.deviceBody.classList.add('fs-active');
                UI.panels.forEach(p => p.classList.add('hidden'));
                
                if(!state.hudHidden) document.getElementById('fsHUD').classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } else {
                UI.deviceWrapper.classList.remove('fixed', 'inset-0', 'bg-black', 'p-0', 'm-0');
                UI.deviceWrapper.classList.add('relative', 'flex-1');
                UI.deviceBody.classList.remove('fs-active');
                UI.panels.forEach(p => p.classList.remove('hidden'));
                
                document.getElementById('fsHUD').classList.add('hidden');
                document.getElementById('revealHUD').classList.add('hidden');
                state.hudHidden = false;
                document.body.style.overflow = '';
            }
            focusDevice();
        }

        function toggleHUD() {
            if(!state.isFullscreen) return;
            state.hudHidden = !state.hudHidden;
            if(state.hudHidden) {
                document.getElementById('fsHUD').classList.add('hidden');
                document.getElementById('revealHUD').classList.remove('hidden');
            } else {
                document.getElementById('fsHUD').classList.remove('hidden');
                document.getElementById('revealHUD').classList.add('hidden');
            }
        }

        // --- Security Systems ---

        function checkLockout() {
            let delay = 0;
            if(state.streak === 3) delay = parseInt(document.getElementById('lock1').value);
            else if(state.streak === 6) delay = parseInt(document.getElementById('lock2').value);
            else if(state.streak >= 10) delay = 3600; 

            if(delay > 0) {
                state.locked = true;
                const ui = document.getElementById('lockoutUI');
                const timerTxt = document.getElementById('timerDisplay');
                ui.style.display = 'flex';
                
                logMsg(`SECURITY ENGAGED: ${delay}s Lockdown`, 'text-red-500 font-bold');
                
                let rem = delay;
                const itv = setInterval(() => {
                    rem--;
                    const m = Math.floor(rem/60).toString().padStart(2, '0');
                    const s = (rem%60).toString().padStart(2, '0');
                    timerTxt.innerText = `${m}:${s}`;
                    
                    if(rem <= 0) {
                        clearInterval(itv);
                        state.locked = false;
                        state.streak = 0;
                        ui.style.display = 'none';
                        focusDevice();
                        logMsg(`Cooldown complete. Ready.`, 'text-blue-400');
                    }
                }, 1000);
            }
        }

        // --- Utilities ---

        function logMsg(msg, colorClass = '') {
            const stream = document.getElementById('logStream');
            const entry = document.createElement('div');
            entry.className = `flex justify-between border-b border-white/5 py-1.5 ${colorClass}`;
            entry.innerHTML = `<span>> ${msg}</span><span class="opacity-20 text-[8px] mt-1">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'})}</span>`;
            stream.prepend(entry);
        }

        function triggerShake() {
            UI.deviceBody.classList.remove('shake');
            void UI.deviceBody.offsetWidth;
            UI.deviceBody.classList.add('shake');
        }

        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            
            document.querySelectorAll('.clock-display').forEach(el => el.innerText = timeStr);
            document.getElementById('dateDisplay').innerText = dateStr;
        }

        function calcEstimation() {
            const secret = document.getElementById('secret').value;
            let combos = state.mode === 'pin' ? Math.pow(10, state.pinLen) : Math.pow(62, secret.length || 1);
            let sec = combos * 0.15; 

            let t = "";
            if(sec < 60) t = sec.toFixed(1) + "s";
            else if(sec < 3600) t = (sec/60).toFixed(1) + "m";
            else if(sec < 86400) t = (sec/3600).toFixed(1) + "h";
            else t = (sec/86400).toFixed(1) + "d";

            document.getElementById('estTimeTxt').innerText = t;
            const pct = Math.min(100, (sec / 1000) * 100);
            document.getElementById('estBar').style.width = pct + "%";
        }

        function clearLogs() {
            state.total = 0;
            state.streak = 0;
            document.getElementById('payloadCount').innerText = '0 EXEC';
            document.getElementById('fsPayloadCount').innerText = '0 EXEC';
            document.getElementById('logStream').innerHTML = '<div class="opacity-30 italic">>> Buffer flushed.</div>';
        }

        function toggleVisibility() {
            const inp = document.getElementById('secret');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        }

        window.onload = init;
    </script>
</body>
</html>
